backend:
  name: github
  repo: lemainamkhanh-arch/whiteglove-website
  branch: main
  base_url: https://sveltia-cms-auth.lemainamkhanh.workers.dev
publish_mode: editorial_workflow
site_url: https://whiteglove.vn
media_folder: assets
public_folder: /assets
collections:
  - name: blog
    label: "Blog (SEO)"
    folder: content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    editor: { preview: false }
    fields:
      - { name: title, label: "Tieu de bai viet", widget: string }
      - { name: description, label: "Meta description", widget: text }
      - { name: slug, label: "Slug (khong dau, gach ngang)", widget: string, hint: "vd: uy-thac-nhap-khau-la-gi" }
      - { name: date, label: "Ngay dang", widget: datetime, type: date, format: "YYYY-MM-DD" }
      - { name: keyword, label: "Tu khoa chinh", widget: string, required: false }
      - { name: draft, label: "Draft (an bai, khong len site)", widget: boolean, default: false, required: false }
      - { name: body, label: "Noi dung bai viet", widget: markdown }
  - name: settings
    label: "Cài đặt chung"
    editor: { preview: false }
    files:
      - name: contact
        label: "Thông tin liên hệ"
        file: content/settings.json
        format: json
        fields:
          - { name: hotline, label: "Hotline (số điện thoại)", widget: string, required: false, hint: "Hiện ở footer khi có giá trị; để trống nếu chưa muốn công khai" }
          - { name: email, label: "Email liên hệ", widget: string, required: false }
          - { name: address, label: "Địa chỉ / khu vực phục vụ", widget: string, required: false }
          - { name: workingHours, label: "Giờ làm việc", widget: string, required: false }
          - { name: facebook, label: "Link Facebook Fanpage", widget: string, required: false }
          - { name: zalo, label: "Link/số Zalo", widget: string, required: false }
  - name: notionplan
    label: "Kế hoạch Notion"
    files:
      - name: plan
        label: "Kế hoạch content từ Notion (read-only)"
        file: content/notion-plan.md
        fields:
          - { name: title, label: "Tiêu đề", widget: string }
          - { name: updated, label: "Cập nhật lúc", widget: string, required: false }
          - { name: body, label: "Danh sách bài viết & trạng thái", widget: markdown }
