name: Update YouTube Shorts
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch YouTube RSS and update JSON
        run: node scripts/update-yt-shorts.js
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/yt-shorts.json
          git diff --staged --quiet || git commit -m 'Auto-update YouTube Shorts data'
          git push
