name: Notion Sync (publish approved posts)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: notion-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull approved posts from Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: node scripts/notion-sync.mjs
      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(notion-sync): publish approved posts from Notion"
          git push
      - name: Build site
        if: steps.diff.outputs.changed == 'true'
        run: node build.js
      - name: Assemble _site
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp -r index.html assets admin content blog sitemap.xml robots.txt llms.txt googlef676cce070b8ebee.html favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        if: steps.diff.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.diff.outputs.changed == 'true'
