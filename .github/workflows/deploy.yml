name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: site-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install image optimizer
        run: npm install --no-save sharp png-to-ico
      - name: Optimize images (auto resize + compress)
        run: node scripts/optimize-images.mjs
      - name: Generate favicon from CMS setting
        run: node scripts/generate-favicon.mjs
      - name: Build site (template + content -> index.html)
        run: node build.js
      - name: Assemble _site
        run: |
          mkdir -p _site
          cp -r index.html assets admin content blog terms privacy sitemap.xml robots.txt llms.txt googlef676cce070b8ebee.html favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          error_count: 20
