<style>
:root{--ink:#1d1b18;--muted:#716d65;--line:#ded9cf;--paper:#fcfbf8;--gold:#b18a52;--blue:#8b6a3d;--blue-soft:#f2eadc;--deep:#161513}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.75}
main{max-width:720px;margin:0 auto;padding:48px 24px 80px}
h1{font-family:'Montserrat','Be Vietnam Pro',ui-sans-serif,sans-serif;font-weight:300;letter-spacing:.005em;font-size:clamp(1.9rem,3.4vw,2.6rem);line-height:1.2;margin:0 0 8px}
.meta{color:var(--muted);font-size:14px;margin-bottom:32px}
article h2{font-family:Montserrat,sans-serif;font-size:22px;margin-top:36px}
article h3{font-family:Montserrat,sans-serif;font-size:17px;margin-top:28px}
article img{max-width:100%;border-radius:8px}
article blockquote{border-left:3px solid var(--gold);margin:24px 0;padding:4px 20px;color:var(--muted)}
article a{color:var(--gold)}
.faq-list{display:flex;flex-direction:column;gap:14px;margin:20px 0 8px}.faq-item{background:var(--blue-soft);border:1px solid var(--line);border-radius:10px;padding:18px 20px}.faq-item h3{margin:0 0 8px;font-size:16px}.faq-item p{margin:0;color:var(--muted)}
.cta{margin-top:48px;padding:24px;background:#f2eadc;border-radius:8px}
.cta a{display:inline-block;margin-top:8px;background:var(--ink);color:#fff;text-decoration:none;padding:10px 22px;border-radius:6px;font-size:14px}
footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--muted);font-size:13px}

.topline,.nav,.navlinks,.brand,.nav-login{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.topline{background:var(--deep);color:#fff;font-size:.62rem;font-weight:600;text-align:center;padding:10px 16px;letter-spacing:.2em;text-transform:uppercase}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(231,229,225,.85);z-index:50;padding:0 max(24px,calc((100vw - 1120px)/2))}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.03em}
.brand-logo{height:30px;width:auto;display:block}
.navlinks{display:flex;gap:24px;align-items:center;font-size:.9rem;font-weight:650}
.navlinks a{color:var(--ink);text-decoration:none}
.navlinks a:not(.btn):hover{color:var(--blue)}
.nav-login{display:inline-flex;align-items:center;gap:6px}
.nav .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;border:1px solid transparent;border-radius:6px;padding:0 20px;font-weight:750;cursor:pointer;transition:.2s ease;text-decoration:none}
.nav .btn.primary{background:var(--ink);color:#fff}
.nav .btn.primary:hover{background:var(--blue)}
.menu{display:none;background:transparent;border:0;font-size:1.4rem;cursor:pointer}
.nav{height:84px;background:rgba(252,251,248,.9)}.navlinks{font-size:.7rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;gap:32px}.navlinks .btn{min-height:40px;padding:0 20px;letter-spacing:.15em}.navlinks a:not(.btn){position:relative;padding:4px 0}.navlinks a:not(.btn)::after{content:'';position:absolute;left:0;bottom:-7px;width:0;height:1px;background:var(--gold);transition:.28s ease}.navlinks a:not(.btn):hover{color:var(--gold)}.navlinks a:not(.btn):hover::after{width:100%}.nav-login{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:.7rem;font-weight:600;letter-spacing:.15em;border-bottom:1px solid transparent;transition:.25s}.nav-login .nav-login-ic{color:var(--gold);flex:0 0 auto}.nav-login:hover{color:var(--blue);border-bottom-color:var(--gold)}.topline{font-size:.64rem;color:rgba(255,255,255,.82)}@media(max-width:900px){.navlinks{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;padding:20px 24px;border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:16px}.navlinks.open{display:flex}.menu{display:block}}
