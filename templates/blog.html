<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog — White Glove Logistics Vietnam</title>
<meta name="description" content="Kiến thức về white glove delivery, giao hàng cao cấp, lắp đặt và ủy thác xuất nhập khẩu hàng high-end tại TP.HCM.">
<link rel="canonical" href="https://whiteglove.vn/blog/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b18;--muted:#716d65;--line:#ded9cf;--paper:#fcfbf8;--gold:#b18a52;--blue:#8b6a3d;--blue-soft:#f2eadc;--deep:#161513}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Be Vietnam Pro',sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:48px 24px 80px}
h1{font-family:Montserrat,sans-serif;font-size:32px}
ul.posts{list-style:none;padding:0}
ul.posts li{border-bottom:1px solid var(--line)}
ul.posts a{display:block;padding:20px 0;text-decoration:none;color:var(--ink)}
ul.posts .d{display:block;font-size:13px;color:var(--muted)}
ul.posts .t{display:block;font-family:Montserrat,sans-serif;font-weight:600;font-size:19px;margin:4px 0}
ul.posts .s{display:block;font-size:14px;color:var(--muted)}
ul.posts a:hover .t{color:var(--gold)}
footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--muted);font-size:13px}

.topline,.nav,.navlinks,.brand,.nav-login{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.topline{background:var(--deep);color:#fff;font-size:.62rem;font-weight:600;text-align:center;padding:10px 16px;letter-spacing:.2em;text-transform:uppercase}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(231,229,225,.85);z-index:50;padding:0 max(24px,calc((100vw - 1120px)/2))}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.03em}
.brand-logo{height:30px;width:auto;display:block}
.navlinks{display:flex;gap:24px;align-items:center;font-size:.9rem;font-weight:650}
.navlinks a{color:var(--ink);text-decoration:none}
.navlinks a:not(.btn):hover{color:var(--blue)}
.nav-login{display:inline-flex;align-items:center;gap:6px}
.nav .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;border:1px solid transparent;border-radius:6px;padding:0 20px;font-weight:750;cursor:pointer;transition:.2s ease;text-decoration:none}
.nav .btn.primary{background:var(--ink);color:#fff}
.nav .btn.primary:hover{background:var(--blue)}
.menu{display:none;background:transparent;border:0;font-size:1.4rem;cursor:pointer}
@media(max-width:900px){.navlinks{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;padding:20px 24px;border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:16px}.navlinks.open{display:flex}.menu{display:block}}
</style>
</head>
<body>
%%HEADER%%
<main>
<h1>Blog</h1>
<ul class="posts">
%%ITEMS%%
</ul>
</main>
<footer>© White Glove Logistics Vietnam · <a href="/" style="color:inherit">whiteglove.vn</a></footer>
</body>
</html>
