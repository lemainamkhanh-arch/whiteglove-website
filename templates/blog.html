<style>
:root{--ink:#1d1b18;--muted:#716d65;--line:#ded9cf;--paper:#fcfbf8;--gold:#b18a52;--blue:#8b6a3d;--blue-soft:#f2eadc;--deep:#161513}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:48px 24px 80px}
h1{font-family:'Montserrat','Be Vietnam Pro',ui-sans-serif,sans-serif;font-weight:300;letter-spacing:.005em;font-size:clamp(1.9rem,3.2vw,2.4rem);line-height:1.15;margin:0 0 4px}
ul.posts{list-style:none;padding:0}
ul.posts li{border-bottom:1px solid var(--line)}
.category-filter{margin:0 0 34px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.category-filter-label{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.category-filter-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.category-filter-btn{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 13px;border-radius:999px;cursor:pointer;font-size:12px;transition:background .2s ease,border-color .2s ease,color .2s ease}
.category-filter-btn:hover,.category-filter-btn.is-active{background:var(--ink);border-color:var(--ink);color:#fff}
.category-chip{display:inline-flex;align-items:center;width:max-content;border-radius:999px;background:var(--blue-soft);color:var(--blue);padding:4px 9px;font-size:10px;font-weight:700;letter-spacing:.05em;line-height:1.2}
.featured .category-chip{margin-top:10px}
ul.posts .category-chip{margin-top:6px}
.post-hidden{display:none!important}
.featured{display:block;text-decoration:none;color:var(--ink);margin-bottom:8px}
.featured .fth{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--blue-soft)}
.featured .fth img{width:100%;height:100%;object-fit:cover;display:block}
.featured .fd{display:block;font-size:13px;color:var(--muted);margin-top:16px}
.featured .ft{display:block;font-family:Montserrat,sans-serif;font-weight:700;font-size:clamp(22px,3vw,30px);line-height:1.2;margin:6px 0}
.featured .fs{display:block;font-size:15px;color:var(--muted)}
.featured:hover .ft{color:var(--gold)}
ul.posts a{display:flex;gap:18px;align-items:center;padding:20px 0;text-decoration:none;color:var(--ink)}
ul.posts .th{flex:0 0 auto;width:150px;height:94px;border-radius:8px;overflow:hidden;background:var(--blue-soft)}
ul.posts .th img{width:100%;height:100%;object-fit:cover;display:block}
ul.posts .tx{flex:1 1 auto;min-width:0}
@media(max-width:560px){ul.posts .th{width:104px;height:70px}}
ul.posts .d{display:block;font-size:13px;color:var(--muted)}
ul.posts .t{display:block;font-family:Montserrat,sans-serif;font-weight:600;font-size:19px;margin:4px 0}
ul.posts .s{display:block;font-size:14px;color:var(--muted)}
ul.posts a:hover .t{color:var(--gold)}
footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--muted);font-size:13px}

.topline,.nav,.navlinks,.brand,.nav-login{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.topline{background:var(--deep);color:#fff;font-size:.62rem;font-weight:600;text-align:center;padding:10px 16px;letter-spacing:.2em;text-transform:uppercase}
.nav{height:77px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(231,229,225,.85);z-index:50;padding:0 max(24px,calc((100vw - 1400px)/2))}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.03em}
.brand-logo{height:30px;width:auto;display:block}
.navlinks{display:flex;gap:30px;align-items:center;font-size:.9rem;font-weight:500;letter-spacing:.01em}
.navlinks a{color:var(--ink);text-decoration:none}
.navlinks a:not(.btn):hover{color:var(--blue)}.nav-dropdown{position:relative}.nav-dropdown-menu{position:absolute;top:calc(100% + 4px);left:0;background:rgba(255,255,255,.98);border:1px solid rgba(222,217,207,.5);border-radius:0;min-width:260px;padding:6px 0;box-shadow:0 6px 20px rgba(35,28,19,.07);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .2s ease,transform .2s ease,visibility .2s;z-index:100}.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown:focus-within .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}.nav-dropdown-menu a{display:block;padding:10px 22px;font-size:.72rem;font-weight:400;letter-spacing:.02em;color:var(--ink);white-space:nowrap;transition:color .15s ease,padding-left .15s ease}.nav-dropdown-menu a:hover{color:var(--blue);padding-left:26px;background:none}@media(max-width:900px){.nav-dropdown-menu{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:none;padding:0 0 0 16px;min-width:0;background:none}.nav-dropdown-menu a{padding:7px 0;font-size:.55rem;font-weight:400;color:var(--muted);white-space:normal;text-transform:none;letter-spacing:.02em}.nav-dropdown-menu a:hover{padding-left:0;color:var(--ink)}}
.nav-login{display:inline-flex;align-items:center;gap:6px}
.nav .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;border:1px solid transparent;border-radius:6px;padding:0 20px;font-weight:750;cursor:pointer;transition:.2s ease;text-decoration:none}
.nav .btn.primary{background:var(--ink);color:#fff}
.nav .btn.primary:hover{background:var(--blue)}
.menu{display:none;background:transparent;border:0;font-size:1.4rem;cursor:pointer}
.nav{height:84px;background:rgba(252,251,248,.9)}.navlinks{font-size:.9rem;font-weight:500;gap:30px}.navlinks .btn{min-height:40px;padding:0 20px;letter-spacing:.15em}.navlinks a:not(.btn){position:relative;padding:4px 0}.navlinks a:not(.btn)::after{content:'';position:absolute;left:0;bottom:-7px;width:0;height:1px;background:var(--gold);transition:.28s ease}.navlinks a:not(.btn):hover{color:var(--gold)}.navlinks a:not(.btn):hover::after{width:100%}.nav-login{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:.75rem;font-weight:600;letter-spacing:.15em;border-bottom:1px solid transparent;transition:.25s}.nav-login .nav-login-ic{color:var(--gold);flex:0 0 auto}.nav-login:hover{color:var(--blue);border-bottom-color:var(--gold)}.topline{font-size:.64rem;color:rgba(255,255,255,.82)}@media(max-width:900px){.navlinks{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;padding:20px 24px;border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:16px}.navlinks.open{display:flex}.menu{display:block}}

/* Mobile menu consistency */
html,body{max-width:100%;overflow-x:clip}
@media(max-width:900px){.navlinks{gap:3px!important;padding:14px 24px 18px!important;max-height:calc(100vh - 84px);overflow-y:auto}.navlinks>a,.nav-dropdown>a{width:100%;min-height:40px;display:flex;align-items:center;font-size:.875rem!important;line-height:1.4;letter-spacing:.035em!important}.navlinks .btn{min-height:44px;font-size:.8rem!important;justify-content:center;margin-top:5px}.nav-dropdown{width:100%}.nav-dropdown-menu a{min-height:34px;display:flex!important;align-items:center;font-size:.78rem!important;padding:7px 0!important}.menu{width:44px;height:44px;display:grid!important;place-items:center;padding:0}}
</style>
